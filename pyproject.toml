[project]
name = "jd-search"
version = "0.1.0"
description = "Personal Singapore job-search agent with GPT-5-mini scoring"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "sqlite-utils>=3.37",
    "openai>=1.40",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "markdown-it-py>=3.0",
    "weasyprint>=62.0",
]

[project.optional-dependencies]
linkedin = ["python-jobspy>=1.1"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
jd = "jd_search.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jd_search"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
