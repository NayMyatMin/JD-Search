# Companies crawled via their ATS APIs.
#
# Only entries with `verified: true` are active. Everything else is skipped
# at runtime but kept here as a backlog. To unlock a Workday tenant, run:
#
#   uv run jd verify-workday https://COMPANY.wdN.myworkdayjobs.com/SITE
#
# and paste the suggested block in.
#
# Fields:
#   name         display name
#   ats          workday | smartrecruiters | oracle_hcm | greenhouse | lever | ashby
#   tenant       for workday: the first path segment (e.g., "unilever")
#                for smartrecruiters: the company slug (e.g., "LVMH2")
#   wd_shard     workday only: wd1|wd3|wd5 etc.
#   wd_site      workday only: the site path segment
#   oracle_pod   oracle_hcm only: full pod subdomain
#   oracle_site  oracle_hcm only: siteNumber value
#   careers_url  human-readable link for reference
#   verified     set true after a live test returns non-zero SG jobs
#   verified_on  YYYY-MM-DD
#   notes        anything quirky

